<div class="lista-container">
  <h2>Listado de Personas Registradas</h2>

  <!-- Muestra el mensaje si la lista está vacía -->
  <div *ngIf="personas.length === 0" class="sin-registros">
    <p><em>No hay personas registradas actualmente.</em></p>
  </div>

  <!-- Muestra la tabla si hay al menos una persona -->
  <table *ngIf="personas.length > 0" class="tabla-personas">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Identificación</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of personas; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.apellido }}</td>
        <td>{{ p.identificacion }}</td>
        <td>
          <button type="button" class="btn-eliminar" (click)="eliminar(i)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
