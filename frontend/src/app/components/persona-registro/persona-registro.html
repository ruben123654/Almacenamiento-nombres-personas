<div class="registro-container">
  <h2>Registro de Persona</h2>
  
  <div class="form-group">
    <label for="nombre">Nombre:</label>
    <input 
      type="text" 
      id="nombre" 
      name="nombre" 
      [(ngModel)]="persona.nombre" 
      placeholder="Ingrese el nombre"
    >
  </div>

  <div class="form-group">
    <label for="apellido">Apellido:</label>
    <input 
      type="text" 
      id="apellido" 
      name="apellido" 
      [(ngModel)]="persona.apellido" 
      placeholder="Ingrese el apellido"
    >
  </div>

  <div class="form-group">
    <label for="identificacion">Identificación / Cédula:</label>
    <input 
      type="text" 
      id="identificacion" 
      name="identificacion" 
      [(ngModel)]="persona.identificacion" 
      placeholder="Ej: 0912345678"
    >
  </div>

  <!-- 👈 Ahora llamamos a la función directamente desde el (click) -->
  <button type="button" (click)="registrarPersona()">Guardar Persona</button>
</div>
